# AI News Briefing Agent — Configuration
# Copy this file to config.yaml and fill in your keys

tavily:
  api_key: "your-tavily-api-key"        # https://tavily.com → API Keys

exa:
  api_key: "your-exa-api-key"           # https://dashboard.exa.ai → API Keys

deepseek:
  api_key: "your-deepseek-api-key"      # https://platform.deepseek.com → API Keys
  model: "deepseek-v4-pro"              # or deepseek-v4-flash for cheaper

feishu:
  webhook_url: ""                        # Optional: Feishu bot webhook URL
  # Without webhook, output prints to stdout and saves to samples/
